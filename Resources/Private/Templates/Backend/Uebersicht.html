<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Module" />

<f:section name="Content">

    <f:if condition="{umgebung.ok}">
        <f:else>
            <div class="callout callout-danger">
                <h4><f:translate key="LLL:EXT:nt_flippdf/Resources/Private/Language/locallang.xlf:env.missing.heading" /></h4>
                <p><f:translate key="LLL:EXT:nt_flippdf/Resources/Private/Language/locallang.xlf:env.missing.text" />
                    <strong><f:for each="{umgebung.missing}" as="fehlt" iteration="i">{fehlt}<f:if condition="{i.isLast}"><f:else>, </f:else></f:if></f:for></strong>
                </p>
            </div>
        </f:else>
    </f:if>

    <h1><f:translate key="LLL:EXT:nt_flippdf/Resources/Private/Language/locallang.xlf:module.heading" /></h1>

    <f:if condition="{ausgaben}">
        <f:then>
            <f:if condition="{nachzuziehen} > 0">
                <div class="callout callout-warning">
                    <p class="mb-2"><f:translate key="LLL:EXT:nt_flippdf/Resources/Private/Language/locallang.xlf:viewer.stale" arguments="{0: nachzuziehen}" /></p>
                    <a class="btn btn-warning btn-sm" href="{modulUri}&amp;aktion=alleErneuern"><f:translate key="LLL:EXT:nt_flippdf/Resources/Private/Language/locallang.xlf:action.refreshAll" /></a>
                </div>
            </f:if>
            <table class="table table-striped table-hover">
                <thead>
                    <tr>
                        <th><f:translate key="LLL:EXT:nt_flippdf/Resources/Private/Language/locallang.xlf:list.slug" /></th>
                        <th><f:translate key="LLL:EXT:nt_flippdf/Resources/Private/Language/locallang.xlf:list.title" /></th>
                        <th><f:translate key="LLL:EXT:nt_flippdf/Resources/Private/Language/locallang.xlf:list.language" /></th>
                        <th class="text-end"><f:translate key="LLL:EXT:nt_flippdf/Resources/Private/Language/locallang.xlf:list.pages" /></th>
                        <th class="text-end"><f:translate key="LLL:EXT:nt_flippdf/Resources/Private/Language/locallang.xlf:list.toc" /></th>
                        <th class="text-end"><f:translate key="LLL:EXT:nt_flippdf/Resources/Private/Language/locallang.xlf:list.size" /></th>
                        <f:for each="{spalten}" as="spalte"><th class="text-end">{spalte.titel}</th></f:for>
                        <th><f:translate key="LLL:EXT:nt_flippdf/Resources/Private/Language/locallang.xlf:list.built" /></th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <f:for each="{ausgaben}" as="ausgabe">
                        <tr>
                            <td>
                                <code>{ausgabe.kennung}</code>
                                <f:if condition="{ausgabe.vorschauVon}">
                                    <span class="badge badge-info"
                                          title="{f:translate(key: 'LLL:EXT:nt_flippdf/Resources/Private/Language/locallang.xlf:list.preview.title', arguments: {0: ausgabe.vorschauVon})}"><f:translate key="LLL:EXT:nt_flippdf/Resources/Private/Language/locallang.xlf:list.preview.badge" /></span>
                                    <span class="text-muted" style="display:block;font-size:.85em"><f:translate key="LLL:EXT:nt_flippdf/Resources/Private/Language/locallang.xlf:list.preview.of" /> <code>{ausgabe.vorschauVon}</code></span>
                                </f:if>
                                <f:if condition="{ausgabe.hatVorschau}">
                                    <span class="text-muted" style="display:block;font-size:.85em"><f:translate key="LLL:EXT:nt_flippdf/Resources/Private/Language/locallang.xlf:list.preview.has" /> <code>{ausgabe.hatVorschau}</code></span>
                                </f:if>
                            </td>
                            <td>{ausgabe.titel}</td>
                            <td>{ausgabe.sprache}</td>
                            <td class="text-end">{ausgabe.seiten}</td>
                            <td class="text-end">
                                <f:if condition="{ausgabe.inhalt}">
                                    <f:then>{ausgabe.inhalt}</f:then>
                                    <f:else><span class="text-warning"><f:translate key="LLL:EXT:nt_flippdf/Resources/Private/Language/locallang.xlf:list.toc.none" /></span></f:else>
                                </f:if>
                            </td>
                            <td class="text-end">{ausgabe.groesseMb} MB</td>
                            <f:for each="{spalten}" as="spalte"><td class="text-end">{spalte.werte.{ausgabe.kennung}}</td></f:for>
                            <td>
                                <f:format.date format="d.m.Y H:i">@{ausgabe.gebaut}</f:format.date>
                                <f:if condition="{ausgabe.betrachterAlt}">
                                    <span class="badge bg-warning"
                                          title="{f:translate(key: 'LLL:EXT:nt_flippdf/Resources/Private/Language/locallang.xlf:list.viewer.title', arguments: {0: ausgabe.betrachterStand})}"><f:translate key="LLL:EXT:nt_flippdf/Resources/Private/Language/locallang.xlf:list.viewer" /></span>
                                </f:if>
                                <f:if condition="{ausgabe.veraltet}">
                                    <span class="badge bg-warning"
                                          title="{f:translate(key: 'LLL:EXT:nt_flippdf/Resources/Private/Language/locallang.xlf:list.outdated.title')}"><f:translate key="LLL:EXT:nt_flippdf/Resources/Private/Language/locallang.xlf:list.outdated" /></span>
                                </f:if>
                            </td>
                            <td class="text-end text-nowrap">
                                <a class="btn btn-default btn-sm" href="{ausgabe.url}" target="_blank" rel="noopener"><f:translate key="LLL:EXT:nt_flippdf/Resources/Private/Language/locallang.xlf:action.view" /></a>
                                <a class="btn btn-default btn-sm" href="{modulUri}&amp;aktion=bearbeiten&amp;kennung={ausgabe.kennung}"><f:translate key="LLL:EXT:nt_flippdf/Resources/Private/Language/locallang.xlf:action.edit" /></a>
                                <a class="btn btn-default btn-sm" href="{modulUri}&amp;aktion=inhalt&amp;kennung={ausgabe.kennung}"><f:translate key="LLL:EXT:nt_flippdf/Resources/Private/Language/locallang.xlf:action.toc" /></a>
                                <a class="btn btn-default btn-sm" href="{modulUri}&amp;aktion=erneuern&amp;kennung={ausgabe.kennung}"
                                   title="{f:translate(key: 'LLL:EXT:nt_flippdf/Resources/Private/Language/locallang.xlf:action.refresh.title')}"><f:translate key="LLL:EXT:nt_flippdf/Resources/Private/Language/locallang.xlf:action.refresh" /></a>
                                <f:if condition="{ausgabe.vorschauVon}">
                                    <f:then>
                                        <span class="btn btn-default btn-sm disabled" aria-disabled="true"
                                              title="{f:translate(key: 'LLL:EXT:nt_flippdf/Resources/Private/Language/locallang.xlf:action.rebuild.preview', arguments: {0: ausgabe.vorschauVon})}"><f:translate key="LLL:EXT:nt_flippdf/Resources/Private/Language/locallang.xlf:action.rebuild" /></span>
                                    </f:then>
                                    <f:else>
                                        <f:if condition="{ausgabe.quelleDa}">
                                            <f:then>
                                                <a class="btn btn-default btn-sm" href="{modulUri}&amp;aktion=neubauen&amp;kennung={ausgabe.kennung}"
                                                   data-flippdf-neubau="{ausgabe.kennung}"
                                                   title="{f:translate(key: 'LLL:EXT:nt_flippdf/Resources/Private/Language/locallang.xlf:action.rebuild.title')}"><f:translate key="LLL:EXT:nt_flippdf/Resources/Private/Language/locallang.xlf:action.rebuild" /></a>
                                            </f:then>
                                            <f:else>
                                                <span class="btn btn-default btn-sm disabled" aria-disabled="true"
                                                      title="{f:translate(key: 'LLL:EXT:nt_flippdf/Resources/Private/Language/locallang.xlf:action.rebuild.gone', arguments: {0: ausgabe.quelle})}"><f:translate key="LLL:EXT:nt_flippdf/Resources/Private/Language/locallang.xlf:action.rebuild" /></span>
                                            </f:else>
                                        </f:if>
                                    </f:else>
                                </f:if>
                                <a class="btn btn-danger btn-sm" href="{modulUri}&amp;aktion=loeschen&amp;kennung={ausgabe.kennung}"
                                   onclick="return confirm('{f:translate(key: \'LLL:EXT:nt_flippdf/Resources/Private/Language/locallang.xlf:action.delete.confirm\', arguments: {0: ausgabe.kennung})}');"><f:translate key="LLL:EXT:nt_flippdf/Resources/Private/Language/locallang.xlf:action.delete" /></a>
                            </td>
                        </tr>
                    </f:for>
                </tbody>
            </table>
        </f:then>
        <f:else>
            <div class="callout callout-info">
                <p><f:translate key="LLL:EXT:nt_flippdf/Resources/Private/Language/locallang.xlf:list.empty" /></p>
            </div>
        </f:else>
    </f:if>

    <h2><f:translate key="LLL:EXT:nt_flippdf/Resources/Private/Language/locallang.xlf:build.heading" /></h2>
    <form method="post" action="{modulUri}" data-flippdf-bauen="1">
        <input type="hidden" name="aktion" value="bauen" />
        <div class="row">
            <div class="col-md-6 form-group">
                <label class="form-label" for="datei"><f:translate key="LLL:EXT:nt_flippdf/Resources/Private/Language/locallang.xlf:build.file" /></label>
                <select class="form-select" id="datei" name="datei" required="required">
                    <option value=""><f:translate key="LLL:EXT:nt_flippdf/Resources/Private/Language/locallang.xlf:build.file.choose" /></option>
                    <f:for each="{pdfs}" as="pdf">
                        <option value="{pdf.uid}">{pdf.name} ({pdf.groesse})</option>
                    </f:for>
                </select>
                <p class="form-text"><f:translate key="LLL:EXT:nt_flippdf/Resources/Private/Language/locallang.xlf:build.file.text" /> <code>pdfFolders</code>.</p>
            </div>
            <div class="col-md-3 form-group">
                <label class="form-label" for="kennung"><f:translate key="LLL:EXT:nt_flippdf/Resources/Private/Language/locallang.xlf:build.slug" /></label>
                <input class="form-control" type="text" id="kennung" name="kennung" required="required"
                       pattern="[A-Za-z0-9_-]+" placeholder="whitepaper-2026" />
                <p class="form-text"><f:translate key="LLL:EXT:nt_flippdf/Resources/Private/Language/locallang.xlf:build.slug.text" /></p>
            </div>
            <div class="col-md-3 form-group">
                <label class="form-label" for="sprache"><f:translate key="LLL:EXT:nt_flippdf/Resources/Private/Language/locallang.xlf:list.language" /></label>
                <select class="form-select" id="sprache" name="sprache">
                    <option value="de"><f:translate key="LLL:EXT:nt_flippdf/Resources/Private/Language/locallang.xlf:language.de" /></option>
                    <option value="en"><f:translate key="LLL:EXT:nt_flippdf/Resources/Private/Language/locallang.xlf:language.en" /></option>
                    <option value="fr"><f:translate key="LLL:EXT:nt_flippdf/Resources/Private/Language/locallang.xlf:language.fr" /></option>
                    <option value="zh"><f:translate key="LLL:EXT:nt_flippdf/Resources/Private/Language/locallang.xlf:language.zh" /></option>
                </select>
                <p class="form-text"><f:translate key="LLL:EXT:nt_flippdf/Resources/Private/Language/locallang.xlf:build.language.text" /></p>
            </div>
        </div>
        <div class="row">
            <div class="col-md-6 form-group">
                <label class="form-label" for="titel"><f:translate key="LLL:EXT:nt_flippdf/Resources/Private/Language/locallang.xlf:build.title" /></label>
                <input class="form-control" type="text" id="titel" name="titel"
                       placeholder="{f:translate(key: 'LLL:EXT:nt_flippdf/Resources/Private/Language/locallang.xlf:build.title.placeholder')}" />
            </div>
            <div class="col-md-6 form-group">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="download" name="download" value="1" checked="checked" />
                    <label class="form-check-label" for="download"><f:translate key="LLL:EXT:nt_flippdf/Resources/Private/Language/locallang.xlf:build.download" /></label>
                </div>
            </div>
        </div>

        <f:for each="{zusatzfelder}" as="abschnitt"><f:format.raw>{abschnitt}</f:format.raw></f:for>

        <button class="btn btn-primary" type="submit"><f:translate key="LLL:EXT:nt_flippdf/Resources/Private/Language/locallang.xlf:build.submit" /></button>
        <p class="form-text"><f:translate key="LLL:EXT:nt_flippdf/Resources/Private/Language/locallang.xlf:build.duration" /></p>
    </form>

    <div id="flippdfFortschritt" hidden style="margin-top:1rem" data-ablage="{adresse}">
        <p id="flippdfFortschrittText" class="text-muted" style="margin-bottom:.35rem"><f:translate key="LLL:EXT:nt_flippdf/Resources/Private/Language/locallang.xlf:build.progress.start" /></p>
        <div class="progress" style="height:1.25rem">
            <div id="flippdfFortschrittBalken" class="progress-bar progress-bar-striped progress-bar-animated"
                 role="progressbar" style="width:0%" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">0&nbsp;%</div>
        </div>
        <p class="form-text" id="flippdfFortschrittDauer"></p>
    </div>

    <script src="{f:uri.resource(path: 'Backend/fortschritt.js', extensionName: 'NtFlippdf')}" defer="defer"></script>

    <hr />
    <p class="text-muted">
        <f:translate key="LLL:EXT:nt_flippdf/Resources/Private/Language/locallang.xlf:footer.storage" /> <code>{ablage}</code>
        &middot;
        <f:translate key="LLL:EXT:nt_flippdf/Resources/Private/Language/locallang.xlf:footer.address" /> <code>{adresse}</code>
    </p>

</f:section>
</html>
