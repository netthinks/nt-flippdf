site_name: nt-flippdf
site_description: Turns a PDF into a page-flip edition in a self-contained directory — page images, full-text search, table of contents and download, with no TYPO3 at runtime
site_url: https://docs.netthinks.com/nt-flippdf/
docs_dir: docs
site_dir: site
copyright: Copyright &copy; 2026 NET.THINKS

theme:
  name: material
  palette:
    - scheme: default
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Installation: installation.md
  - Building editions: usage.md
  - On a page: content-element.md
  - Configuration: configuration.md
  - For developers: development.md
  - Changelog: changelog.md


markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ['.']
  - tables
  - attr_list
  - md_in_html
  - def_list
  - toc:
      permalink: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  - glightbox
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          build: true
          default: true
        - locale: de
          name: Deutsch
          build: true
          nav_translations:
            Home: Startseite
            Installation: Installation
            Building editions: Ausgaben bauen
            On a page: Auf einer Seite
            Configuration: Konfiguration
            For developers: Für Entwickler
            Changelog: Änderungen
